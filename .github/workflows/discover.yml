name: Discover animals
on:
  push:
    paths:
      - '.github/workflows/discover.yml'
      - 'data-pipeline/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: animal-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      TZ: Pacific/Kiritimati
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment configuration
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          node --input-type=module -e '
            const hook = process.env.VERCEL_DEPLOY_HOOK;
            if (!hook) throw new Error("Add the VERCEL_DEPLOY_HOOK repository secret. See README.md.");
            let url;
            try { url = new URL(hook); } catch { throw new Error("Invalid Vercel Deploy Hook URL."); }
            if (url.protocol !== "https:" || url.hostname !== "api.vercel.com" || !url.pathname.startsWith("/v1/integrations/deploy/")) throw new Error("Expected a Vercel Deploy Hook URL.");
          '
      - run: npm ci
      - name: Top up the next 14 days
        run: npm run discover
      - name: Verify history and validate site
        run: |
          node --import tsx data-pipeline/schedule-integrity.ts
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data public/img data-pipeline/discovery-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily animal schedule'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Request Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node data-pipeline/deploy.mjs
