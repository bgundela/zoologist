name: Discover animals
on:
  push:
    paths:
      - '.github/workflows/discover.yml'
      - 'data-pipeline/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
  schedule:
    - cron: '23 5 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: animal-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      TZ: Pacific/Kiritimati
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set schedule date
        run: echo "SCHEDULE_DATE=$(date +%F)" >> "$GITHUB_ENV"
      - name: Top up the next 14 days
        run: npm run discover
      - name: Verify history and validate site
        run: |
          node --import tsx data-pipeline/schedule-integrity.ts
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated content
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data public/img data-pipeline/discovery-state.json
          message='Advance animal discovery'
          if ! git diff --cached --quiet -- public/data/schedule.json; then
            echo 'schedule_changed=true' >> "$GITHUB_OUTPUT"
            message='Update daily animal schedule'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Request Vercel deployment
        # The first daily run also retries publication of already committed entries.
        if: github.event_name != 'schedule' || github.event.schedule == '23 5 * * *' || steps.commit.outputs.schedule_changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node data-pipeline/deploy.mjs
      - name: Check coverage for tomorrow
        run: |
          node --import tsx --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { dayIndex } from "./src/lib/today.ts";
            const schedule = JSON.parse(readFileSync("public/data/schedule.json", "utf8"));
            if (schedule.order.length <= dayIndex(process.env.SCHEDULE_DATE, schedule.launch) + 1) {
              console.error("::error::Discovery did not schedule an animal for tomorrow. The site will use its rotation if the schedule runs out.");
              process.exitCode = 1;
            }
          '
